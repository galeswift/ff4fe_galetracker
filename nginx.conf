server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep the visitor's host and https instead of nginx's own http://host:80
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Links to the old jQuery tracker's pages (at the site root or under /tracker) go to the new app.
    # ($request_uri is the original request, so nginx's own internal redirects never match.)
    if ($request_uri ~ "^(/tracker)?/(tracker|trackerindex|instructions|release)\.html(\?|$)") {
        return 301 /tracker/;
    }

    # The site is public at /tracker/. Accept paths with or without that prefix, so it works
    # whether or not the proxy strips it.
    rewrite ^/tracker$ /tracker/ permanent;
    rewrite ^/tracker/(.*)$ /$1 last;

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
