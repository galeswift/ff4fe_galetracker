# The tracker's home is the root of tracker.galeswift.com. It used to be served at
# www.ff4fedraft.com/tracker; requests for that host are sent to the new domain.
map $host $old_tracker_host {
    default 0;
    ff4fedraft.com 1;
    www.ff4fedraft.com 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep the visitor's host and https instead of nginx's own http://host:80
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Old domain: the proxy forwards /tracker... unstripped. Old flag links can't be carried over,
    # so everything lands on the new home page.
    if ($old_tracker_host) {
        return 301 https://tracker.galeswift.com/;
    }

    # Links to the old jQuery tracker's pages, or to the old /tracker/ path, go to the app.
    # ($request_uri is the original request, so nginx's own internal redirects never match.)
    if ($request_uri ~ "^(/tracker)?/(tracker|trackerindex|instructions|release)\.html(\?|$)") {
        return 301 /;
    }
    rewrite ^/tracker(/.*)?$ / permanent;

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
